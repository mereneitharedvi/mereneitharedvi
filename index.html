<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mereneith Aredvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #e8e0d5;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 720px;
        }

        .label {
            font-size: 0.75rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #c9a227;
            margin-bottom: 1.8rem;
            font-weight: 400;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.2rem, 9vw, 5.5rem);
            font-weight: 500;
            color: #f5f0e8;
            letter-spacing: 0.02em;
            margin-bottom: 1.2rem;
            line-height: 1.1;
        }

        .divider {
            width: 48px;
            height: 1px;
            background-color: #c9a227;
            margin: 0 auto 2rem;
            opacity: 0.7;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.15rem, 3vw, 1.45rem);
            font-weight: 400;
            font-style: italic;
            color: #b8a99a;
            max-width: 520px;
            margin: 0 auto 3.5rem;
            line-height: 1.7;
        }

        .status {
            font-size: 0.7rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: #8a7a6a;
            border: 1px solid #3a322c;
            padding: 0.7rem 1.6rem;
            display: inline-block;
        }

        .status span {
            color: #c9a227;
        }
    </style>
</head>
<body>
    <div class="container">
        <p class="label">Dark Romance · Crime · Thriller</p>
        
        <h1>Mereneith Aredvi</h1>
        
        <div class="divider"></div>
        
        <p class="tagline">
            Stories of power, desire, and the violence that lives between them.
        </p>
        
        <div class="status">
            Site under construction · <span>Coming Soon</span>
        </div>
    </div>
</body>
</html>
