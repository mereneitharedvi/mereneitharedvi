<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mereneith Aredvi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0a0c;
            color: #e6ddd2;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 40%;
            left: 50%;
            width: 1100px;
            height: 1100px;
            background: 
                radial-gradient(circle at 40% 40%, rgba(201, 162, 39, 0.04) 0%, transparent 55%),
                radial-gradient(circle at 65% 60%, rgba(110, 25, 35, 0.065) 0%, transparent 50%),
                radial-gradient(circle at 30% 70%, rgba(55, 30, 75, 0.045) 0%, transparent 45%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ===== NAVIGATION ===== */
        nav {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 3rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.35rem;
            font-weight: 500;
            color: #f0e9df;
            letter-spacing: 0.04em;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2.6rem;
            list-style: none;
        }

        .nav-links a {
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #9a8b7a;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .nav-links a:hover {
            color: #c9a227;
        }

        .nav-links a.active {
            color: #c9a227;
        }

        /* ===== HERO ===== */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem 1.5rem 5rem;
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 780px;
            animation: fadeIn 1.5s ease-out forwards;
        }

        .label {
            font-size: 0.7rem;
            letter-spacing: 0.42em;
            text-transform: uppercase;
            color: #c9a227;
            margin-bottom: 2.4rem;
            font-weight: 400;
            opacity: 0.95;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(3.4rem, 9.5vw, 5.8rem);
            font-weight: 500;
            color: #f7f1e8;
            letter-spacing: 0.03em;
            margin-bottom: 1.4rem;
            line-height: 1.05;
        }

        .divider {
            width: 42px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c9a227, #8b1e2d, transparent);
            margin: 0 auto 2.2rem;
            opacity: 0.9;
        }

        .tagline {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(1.2rem, 3.1vw, 1.55rem);
            font-weight: 400;
            font-style: italic;
            color: #b5a494;
            max-width: 540px;
            margin: 0 auto 4rem;
            line-height: 1.75;
        }

        .status {
            font-size: 0.68rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: #7a6d60;
            border: 1px solid #3a2a28;
            padding: 0.85rem 1.9rem;
            display: inline-block;
            background: rgba(255, 255, 255, 0.015);
        }

        .status span {
            color: #c9a227;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 800px) {
            nav {
                padding: 1.5rem 1.4rem;
                flex-direction: column;
                gap: 1.4rem;
            }

            .nav-links {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Mereneith Aredvi</a>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="works.html">Works</a></li>
            <li><a href="worlds.html">Worlds</a></li>
            <li><a href="about.html">The Storyteller</a></li>
            <li><a href="contact.html">Write to The Storyteller</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="container">
            <p class="label">Dark Romance · Crime · Thriller</p>
            
            <h1>Mereneith Aredvi</h1>
            
            <div class="divider"></div>
            
            <p class="tagline">
                Stories of power, desire, and the violence<br>that lives between them.
            </p>
            
            <div class="status">
                Site under construction · <span>Coming Soon</span>
            </div>
        </div>
    </section>

</body>
</html>
